# Nizam -- Apache vhost for the Render/Docker container. Security headers
# (CSP, X-Frame-Options, etc.) are set at the PHP layer (app/Response.php),
# not here -- this only needs to route requests through the front controller
# and serve public/ as docroot, mirroring public/.htaccess's own rewrite rule
# exactly (kept as belt-and-braces defense in depth alongside this vhost).
#
# "@@PORT@@" is substituted by entrypoint.sh at container start: Render
# assigns the container a $PORT at runtime (not always 80) and routes
# traffic to exactly that port, so this can't be a fixed "*:80" the way a
# normal static vhost would be.
<VirtualHost *:@@PORT@@>
    ServerName nizam.local
    ServerSignature Off
    DocumentRoot /var/www/html/public

    # mod_php/Apache does not pass the Authorization header through to
    # $_SERVER['HTTP_AUTHORIZATION'] by default -- found live: the scheduled
    # backup endpoint (BackupController::scheduled(), bearer-token gated)
    # got 401 on every call despite the token genuinely matching, because
    # PHP was reading an empty string regardless of what was actually sent.
    # This is the standard, documented fix.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Versioned asset URLs (assetUrl() appends the source mtime) are immutable
    # by definition; cache them aggressively at browsers/edges. sw.js and
    # dynamic PHP routes are outside /assets and never receive this policy.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # These apply to static files too; PHP sets the same central policy on
    # dynamic responses. HSTS belongs only in this online/container vhost,
    # never in the offline LAN Apache configuration.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()"
    Header always unset X-Powered-By

    # Everything outside public/ (config/, storage/, database/, vendor/,
    # app/ source) is simply never inside DocumentRoot -- the same guarantee
    # the Windows packaged Apache config relies on (packaging/apache/
    # httpd-nizam.conf's own note).

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

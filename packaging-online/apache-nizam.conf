# Nizam -- Apache vhost for the Render/Docker container. Security headers
# (CSP, X-Frame-Options, etc.) are set at the PHP layer (app/Response.php),
# not here -- this only needs to route requests through the front controller
# and serve public/ as docroot, mirroring public/.htaccess's own rewrite rule
# exactly (kept as belt-and-braces defense in depth alongside this vhost).
#
# "@@PORT@@" is substituted by entrypoint.sh at container start: Render
# assigns the container a $PORT at runtime (not always 80) and routes
# traffic to exactly that port, so this can't be a fixed "*:80" the way a
# normal static vhost would be.
<VirtualHost *:@@PORT@@>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Everything outside public/ (config/, storage/, database/, vendor/,
    # app/ source) is simply never inside DocumentRoot -- the same guarantee
    # the Windows packaged Apache config relies on (packaging/apache/
    # httpd-nizam.conf's own note).

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

; Nizam -- production-only PHP policy for the online container.
; The Windows/XAMPP package has its own PHP runtime and is unaffected.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 300
max_input_time = 120
max_input_vars = 5000
upload_max_filesize = 55M
post_max_size = 64M
max_file_uploads = 10

default_charset = "UTF-8"
date.timezone = "UTC"
allow_url_include = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 86400
session.sid_length = 48
session.sid_bits_per_character = 6

; The image is immutable: every code change creates a new image, so checking
; PHP source mtimes on every request is pure overhead. Mutable generated
; config lives outside the image and is rewritten before Apache starts.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Application code has no subprocess contract. Removing process-spawn entry
; points materially shrinks the impact of any future code-injection bug.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; Nizam -- packaged MariaDB config. @@DATA_DIR@@ and @@RUNTIME_DIR@@ are
; substituted with real absolute paths by the installer at install time
; (packaging/installer.iss), the same mechanism as httpd-nizam.conf.
[mysqld]
port=3319
bind-address=127.0.0.1
basedir="@@RUNTIME_DIR@@/mysql"
datadir="@@DATA_DIR@@/database/data"
pid_file="@@DATA_DIR@@/database/mysql.pid"
socket="@@DATA_DIR@@/database/mysql.sock"
log-error="@@DATA_DIR@@/storage/logs/mariadb-error.log"
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
skip-name-resolve
; Nizam's own connection layer sets STRICT_ALL_TABLES,NO_ZERO_DATE,
; NO_ENGINE_SUBSTITUTION per-session (App\Database::connection(),
; PDO::MYSQL_ATTR_INIT_COMMAND) -- no server-wide sql_mode override needed
; here, matching the exact server this app was tested against.

[client]
port=3319
socket="@@DATA_DIR@@/database/mysql.sock"
default-character-set=utf8mb4

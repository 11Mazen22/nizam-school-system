# Nizam -- packaged Apache config. Purpose-built for this one application,
# not a copy of a general-purpose httpd.conf: only the modules and directives
# Nizam's own app/router/.htaccess files actually rely on are loaded.
#
# @@APP_DIR@@  = Program Files\Nizam\app       (the PHP application, read-mostly)
# @@DATA_DIR@@ = ProgramData\Nizam              (mutable school data)
# @@RUNTIME_DIR@@ = Program Files\Nizam\runtime (Apache/PHP/MariaDB binaries)
# Substituted with real absolute paths by the installer at install time
# (packaging/installer.iss, CurStepChanged(ssPostInstall)) -- Inno Setup only
# knows the real {app}/{commonappdata} paths once the user's install choices
# are final, so this file ships as a template and is written out for real
# during installation, never hand-edited afterward.

ServerRoot "@@RUNTIME_DIR@@/apache"
ServerName 127.0.0.1
ServerAdmin admin@localhost

# --- Modules -----------------------------------------------------------
# Trimmed from XAMPP's own proven module list: kept everything Nizam's
# routing/.htaccess/PHP execution depends on, dropped what it never uses
# (SSL -- no cert needed for a loopback-only server per §O-31/blueprint §9;
# proxy/proxy_ajp -- Nizam never proxies anything; cgi/isapi -- PHP runs as
# a module, not CGI; dav_lock -- no WebDAV; status/info -- server
# introspection endpoints with no purpose here, dropped to shrink attack
# surface; auth_basic/authn_file/authz_groupfile/authz_user -- Nizam does
# its own application-level auth, never HTTP Basic Auth).
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule allowmethods_module modules/mod_allowmethods.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so

# PHP itself, wired the same way the already-tested XAMPP install runs it
# (mod_php, not php-cgi/FastCGI) -- §S "don't introduce unnecessary
# technologies," and this app has only ever been verified against mod_php.
LoadFile "@@RUNTIME_DIR@@/php/php8ts.dll"
LoadFile "@@RUNTIME_DIR@@/php/libpq.dll"
LoadFile "@@RUNTIME_DIR@@/php/libsqlite3.dll"
LoadModule php_module "@@RUNTIME_DIR@@/php/php8apache2_4.dll"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
<IfModule php_module>
    PHPINIDir "@@RUNTIME_DIR@@/php"
</IfModule>

TypesConfig conf/mime.types

# --- Networking ----------------------------------------------------------
# Loopback-only, non-default port (blueprint §9: "By default, Nizam should
# bind only to localhost... Do not expose the local server to the network
# accidentally"). A distinctive port avoids colliding with any other locally
# installed MySQL/WAMP/XAMPP stack's own Apache.
Listen 127.0.0.1:8890

PidFile logs/httpd.pid
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# --- Logging ---------------------------------------------------------
# Outside Program Files, alongside the rest of Nizam's mutable data --
# never bundled into the app-files tree an update/reinstall replaces.
ErrorLog "@@DATA_DIR@@/storage/logs/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "@@DATA_DIR@@/storage/logs/apache-access.log" common

# --- Deny everything by default, then explicitly re-open only public/ ---
<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "@@APP_DIR@@/public"
<Directory "@@APP_DIR@@/public">
    # No Indexes (no directory browsing), no ExecCGI/Includes (PHP runs as
    # a module and Nizam never uses SSI) -- narrower than XAMPP's own
    # default "Indexes FollowSymLinks Includes ExecCGI" on purpose.
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Everything outside public/ (config/, storage/, database/, vendor/, app/
# source) is simply never inside DocumentRoot at all under this layout --
# the strongest possible guarantee against it ever being served, independent
# of whether .htaccess processing is ever disabled by a future Apache change.

DirectoryIndex index.php

<IfModule mime_module>
    AddType application/x-httpd-php .php
</IfModule>

# The one piece of packaging-specific wiring the application itself reads
# (app/helpers/functions.php's dataPath()): redirects config/config.php,
# storage/logs, storage/uploads, and database/backups into ProgramData.
# Every existing dev/XAMPP deployment leaves this unset and is completely
# unaffected -- see dataPath()'s own docblock.
SetEnv NIZAM_DATA_PATH "@@DATA_DIR@@"

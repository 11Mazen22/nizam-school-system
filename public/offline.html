<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>غير متصل بالإنترنت — هضبة الأهرام الثانوية</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; color: #212529; text-align: center; }
    .container { max-width: 500px; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #dc3545; margin-bottom: 1rem; }
    p { margin-bottom: 2rem; color: #6c757d; }
    button { background-color: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
    button:hover { background-color: #0b5ed7; }
  </style>
</head>
<body>
  <div class="container">
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصالك بالشبكة قد انقطع. يرجى التحقق من اتصالك والمحاولة مرة أخرى.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>

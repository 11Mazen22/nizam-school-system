name: Daily Year Rollover Reminder

permissions:
  contents: read

concurrency:
  group: nizam-daily-year-reminder
  cancel-in-progress: false

# Checks if academic year is ending soon and sends reminders
# Reminders sent at 60, 30, 14, and 7 days before end date
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch: {} # manual trigger

jobs:
  check-year-end:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check year end and send reminders
        env:
          NIZAM_URL: ${{ secrets.NIZAM_URL }}
          NIZAM_SCHEDULED_TOKEN: ${{ secrets.NIZAM_SCHEDULED_TOKEN }}
        run: |
          test -n "$NIZAM_URL" && test -n "$NIZAM_SCHEDULED_TOKEN"
          status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 180 -o /tmp/response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NIZAM_SCHEDULED_TOKEN" \
            "${NIZAM_URL%/}/scheduled/year-rollover")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "::error::Year rollover check failed (HTTP $status)"
            exit 1
          fi

name: Weekly Database Cleanup

permissions:
  contents: read

concurrency:
  group: nizam-weekly-cleanup
  cancel-in-progress: false

# Runs weekly maintenance tasks:
# - Clean old activity logs (90+ days)
# - Remove failed backup records (30+ days)  
# - Clear expired login lockouts
# - Close old academic years (2+ years old)
on:
  schedule:
    - cron: '0 3 * * 0' # 03:00 UTC every Sunday
  workflow_dispatch: {} # manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run database cleanup tasks
        env:
          NIZAM_URL: ${{ secrets.NIZAM_URL }}
          NIZAM_SCHEDULED_TOKEN: ${{ secrets.NIZAM_SCHEDULED_TOKEN }}
        run: |
          test -n "$NIZAM_URL" && test -n "$NIZAM_SCHEDULED_TOKEN"
          status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 180 -o /tmp/response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NIZAM_SCHEDULED_TOKEN" \
            "${NIZAM_URL%/}/scheduled/cleanup")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "::error::Database cleanup failed (HTTP $status)"
            exit 1
          fi

name: Continuous integration

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: nizam_ci_root
          MYSQL_DATABASE: nizam
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnizam_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_pgsql, zip
          coverage: none

      - name: Validate locked dependencies
        run: |
          composer validate --strict
          composer audit --locked
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install browser test tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure disposable test database
        run: |
          cat > config/config.php <<'PHP'
          <?php
          return [
              'driver' => 'mysql',
              'host' => '127.0.0.1',
              'port' => 3306,
              'database' => 'nizam',
              'username' => 'root',
              'password' => 'nizam_ci_root',
              'charset' => 'utf8mb4',
              'scheduled_backup_token' => 'ci-only-not-a-production-secret-123456',
              'email' => ['enabled' => false],
          ];
          PHP

      - name: Lint first-party PHP
        run: find app bin database tests views -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run contract and HTTP suites
        run: npm test

  postgres:
    name: PostgreSQL parity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_PASSWORD: nizam_ci_pg
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Run PostgreSQL parity suite
        env:
          NIZAM_PG_HOST: 127.0.0.1
          NIZAM_PG_PORT: '5432'
          NIZAM_PG_USER: postgres
          NIZAM_PG_PASSWORD: nizam_ci_pg
        run: php tests/postgres-parity.php

  container:
    name: Production container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the exact Railway image
        run: docker build --file packaging-online/Dockerfile --tag nizam-production:test .

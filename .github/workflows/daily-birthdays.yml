name: Daily Birthday Notifications

permissions:
  contents: read

concurrency:
  group: nizam-daily-birthdays
  cancel-in-progress: false

# Runs every day at 8:00 AM UTC to check for student birthdays
# and send email notifications to staff
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch: {} # manual trigger

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check birthdays and send notifications
        env:
          NIZAM_URL: ${{ secrets.NIZAM_URL }}
          NIZAM_SCHEDULED_TOKEN: ${{ secrets.NIZAM_SCHEDULED_TOKEN }}
        run: |
          test -n "$NIZAM_URL" && test -n "$NIZAM_SCHEDULED_TOKEN"
          status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 180 -o /tmp/response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NIZAM_SCHEDULED_TOKEN" \
            "${NIZAM_URL%/}/scheduled/birthdays")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "::error::Birthday check failed (HTTP $status)"
            exit 1
          fi
